name: Build & deploy site

# Builds the whole static site (portfolio + Obsidian-driven blog) and deploys it to
# GitHub Pages on every push to main. Generated output is never committed.
#
# ONE-TIME SETUP (owner): repo Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent Pages deployment; do NOT cancel an in-flight run — GitHub's
# recommended Pages pattern lets a running deployment finish rather than interrupting it
# mid-upload (the next push then deploys after it completes).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to a patch version for reproducible CI (Constitution: pinned/reproducible build).
          python-version: "3.12.7"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Stdlib-only renderer unit tests (no extra dependency). Runs BEFORE the build so a
      # renderer/highlighter regression fails the pipeline early (feature 004).
      - name: Run renderer unit tests
        run: python -m unittest discover -s tests -v

      - name: Build site
        run: python scripts/build_blog.py --out _site

      - name: Verify build (Definition of Done)
        run: python scripts/verify_build.py --out _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
