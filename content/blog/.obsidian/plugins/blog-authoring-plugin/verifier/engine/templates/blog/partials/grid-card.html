<a data-card=""{{HOMENOTE}} data-ripple="" data-reveal="" href="{{URL}}" data-cat="{{CAT}}" style="opacity:0; transform:translateY(30px); transition:opacity .8s cubic-bezier(.2,0,0,1), transform .8s cubic-bezier(.2,0,0,1), box-shadow .4s, border-color .4s; position:relative; cursor:pointer; display:flex; flex-direction:column; border-radius:22px; padding:22px; background:linear-gradient(160deg, rgba(24,34,31,0.85), rgba(15,21,19,0.85)); border:1px solid rgba(255,255,255,0.08); box-shadow:0 14px 40px rgba(0,0,0,0.28); overflow:hidden; min-height:230px; text-decoration:none; color:inherit;">
  <div aria-hidden="true" data-cardglow="" style="position:absolute; top:-50%; right:-20%; width:60%; height:80%; background:radial-gradient(circle, rgba(52,230,160,0.14), transparent 70%); filter:blur(12px); opacity:0; transition:opacity .4s; pointer-events:none;"></div>
  <div style="position:relative; display:flex; align-items:center; justify-content:space-between; gap:10px;">
    <span style="padding:5px 11px; border-radius:999px; background:{{TAG_BG}}; border:1px solid {{TAG_BORDER}}; font-family:'JetBrains Mono',monospace; font-size:10.5px; color:{{TAG_COLOR}};">{{TAG_LABEL}}</span>
    <span style="width:9px; height:9px; border-radius:50%; background:{{DOT}}; box-shadow:0 0 10px {{DOT}};"></span>
  </div>
  <h3 style="position:relative; margin:18px 0 0; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:20px; line-height:1.2; letter-spacing:-0.01em; text-wrap:pretty;">{{TITLE}}</h3>
  <p style="position:relative; margin:12px 0 0; flex:1; font-size:14px; line-height:1.65; color:#9FB0AA; text-wrap:pretty;">{{DEK}}</p>
  <div style="position:relative; display:flex; align-items:center; justify-content:space-between; margin-top:20px; padding-top:16px; border-top:1px solid rgba(255,255,255,0.06);">
    <span style="font-family:'JetBrains Mono',monospace; font-size:11.5px; color:#828D86;">{{DATE}} · {{READ_TIME}}</span>
    <span data-cardarrow="" style="display:inline-grid; place-items:center; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,0.05); color:#34E6A0; font-size:15px; transition:transform .35s cubic-bezier(.2,0,0,1);">→</span>
  </div>
</a>
