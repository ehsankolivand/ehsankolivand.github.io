<aside class="callout callout--{{KIND}}" role="note" aria-label="{{ARIA}}" data-reveal="" style="opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.2,0,0,1), transform .7s cubic-bezier(.2,0,0,1);">
  <div class="callout__head"><span class="callout__icon" aria-hidden="true">{{ICON}}</span><span class="callout__label">{{TITLE}}</span></div>
  <div class="callout__body">{{BODY}}</div>
</aside>
