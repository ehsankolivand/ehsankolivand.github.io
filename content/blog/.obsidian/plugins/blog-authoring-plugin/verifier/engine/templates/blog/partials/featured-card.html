<a data-card="" data-ripple="" href="{{URL}}" data-cat="{{CAT}}" style="position:relative; cursor:pointer; display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:clamp(20px,3vw,40px); align-items:stretch; border-radius:28px; padding:clamp(18px,2.4vw,26px); background:linear-gradient(160deg, rgba(24,34,31,0.92), rgba(15,21,19,0.92)); border:1px solid rgba(255,255,255,0.08); box-shadow:0 18px 50px rgba(0,0,0,0.35); transition:transform .4s cubic-bezier(.2,0,0,1), box-shadow .4s, border-color .4s; overflow:hidden; text-decoration:none; color:inherit;">
  <div aria-hidden="true" data-cardglow="" style="position:absolute; top:-40%; left:30%; width:50%; height:90%; background:radial-gradient(circle, rgba(52,230,160,0.16), transparent 70%); filter:blur(12px); opacity:0; transition:opacity .4s; pointer-events:none;"></div>
  {{COVER}}
  <div style="display:flex; flex-direction:column; justify-content:center; padding:8px 6px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <span style="padding:5px 12px; border-radius:999px; background:{{TAG_BG}}; border:1px solid {{TAG_BORDER}}; font-family:'JetBrains Mono',monospace; font-size:11px; color:{{TAG_COLOR}};">{{TAG_LABEL}}</span>
      <span style="font-family:'JetBrains Mono',monospace; font-size:12px; color:#828D86;">Featured · {{DATE}} · {{READ_TIME}}</span>
    </div>
    <h2 style="margin:18px 0 0; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(26px,3.4vw,42px); line-height:1.08; letter-spacing:-0.02em; text-wrap:pretty;">{{TITLE}}</h2>
    <p style="margin:18px 0 0; font-size:clamp(14px,1.7vw,16.5px); line-height:1.7; color:#9FB0AA; text-wrap:pretty;">{{DEK}}</p>
    <span style="display:inline-flex; align-items:center; gap:9px; margin-top:26px; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; color:#34E6A0;">Read the full piece <span data-cardarrow="" style="display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:rgba(52,230,160,0.14); transition:transform .35s cubic-bezier(.2,0,0,1);">→</span></span>
  </div>
</a>
