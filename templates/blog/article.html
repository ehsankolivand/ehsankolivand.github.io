<main data-screen-label="Article" style="position:relative; z-index:2;">
    <article style="max-width:760px; margin:0 auto; padding:120px clamp(20px,6vw,40px) 40px;">
      <!-- back -->
      <a href="/blog/" data-ripple="" data-magnetic="" style="all:unset; box-sizing:border-box; cursor:pointer; position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:8px; padding:9px 16px 9px 13px; border-radius:999px; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.1); color:#9FB0AA; font-size:13.5px; font-weight:500; transition:transform .4s cubic-bezier(.2,0,0,1);">← All notes</a>

      <!-- header -->
      <div data-reveal="" style="opacity:0; transform:translateY(24px); transition:opacity .8s cubic-bezier(.2,0,0,1), transform .8s cubic-bezier(.2,0,0,1); margin-top:28px;">
        <div style="display:flex; flex-wrap:wrap; align-items:center; gap:12px;">
          <span style="padding:5px 13px; border-radius:999px; background:{{TAG_BG}}; border:1px solid {{TAG_BORDER}}; font-family:'JetBrains Mono',monospace; font-size:11.5px; color:{{TAG_COLOR}};">{{TAG_LABEL}}</span>
          <span style="font-family:'JetBrains Mono',monospace; font-size:12.5px; color:#828D86;"><time datetime="{{DATE_ISO}}">{{DATE}}</time> · {{READ_TIME}} read</span>
        </div>
        <h1 style="margin:22px 0 0; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:clamp(30px,5.4vw,54px); line-height:1.06; letter-spacing:-0.025em; text-wrap:balance;">{{TITLE}}</h1>
        <p style="margin:22px 0 0; font-size:clamp(16px,2.1vw,20px); line-height:1.6; color:#9FB0AA; text-wrap:pretty;">{{DEK}}</p>
        <!-- author row -->
        <div style="display:flex; align-items:center; gap:13px; margin-top:28px; padding-top:24px; border-top:1px solid rgba(255,255,255,0.07);">
          <div aria-hidden="true" style="position:relative; width:42px; height:34px; flex:none;">
            <span style="position:absolute; top:-9px; left:9px; width:2px; height:10px; background:#7DF0C2; border-radius:2px; transform-origin:bottom; transform:rotate(-20deg);"></span>
            <span style="position:absolute; top:-9px; right:9px; width:2px; height:10px; background:#7DF0C2; border-radius:2px; transform-origin:bottom; transform:rotate(20deg);"></span>
            <div style="position:absolute; inset:0; border-radius:14px 14px 7px 7px; background:linear-gradient(160deg,#CBB07A,#0C1512); box-shadow:inset 0 2px 0 rgba(255,255,255,0.4);">
              <span style="position:absolute; top:12px; left:10px; width:7px; height:7px; border-radius:50%; background:#04130D; animation:botEye 5s ease-in-out infinite;"></span>
              <span style="position:absolute; top:12px; right:10px; width:7px; height:7px; border-radius:50%; background:#04130D; animation:botEye 5s ease-in-out infinite;"></span>
            </div>
          </div>
          <div>
            <div style="font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; color:#EDF2EF;"><a href="/" rel="author" style="color:inherit; text-decoration:none;">Ehsan Kolivand</a></div>
            <div style="font-size:12.5px; color:#828D86;">Senior Android Engineer</div>
          </div>
        </div>
      </div>

      {{COVER}}

      <!-- body blocks -->
      <div style="margin-top:14px;">
        {{BODY}}
      </div>

      <!-- end / signature -->
      <div data-reveal="" style="opacity:0; transform:translateY(20px); transition:opacity .7s cubic-bezier(.2,0,0,1), transform .7s cubic-bezier(.2,0,0,1); margin:52px 0 0; padding:32px 26px 26px; border-top:1px solid var(--rule-strong); text-align:center;">
        <div style="font-family:var(--font-mono); font-size:12px; color:var(--sand-deep);">$ echo "thanks for reading"</div>
        <div style="margin-top:10px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(18px,2.4vw,24px); color:#EDF2EF;">Got a sharper take? <span style="color:#34E6A0;">I'd love to hear it.</span></div>
        <a href="/blog/" data-ripple="" data-magnetic="" style="all:unset; box-sizing:border-box; cursor:pointer; position:relative; overflow:hidden; display:inline-flex; align-items:center; gap:9px; margin-top:20px; padding:13px 24px; border-radius:14px; background:linear-gradient(135deg,#34E6A0,#18A06A); color:#04130D; font-weight:700; font-size:14.5px; transition:transform .4s cubic-bezier(.2,0,0,1);">← Back to all notes</a>
      </div>

      {{MORE_NOTES_SECTION}}
    </article>
  </main>
